# 板端 Nginx 站点配置
# 安装位置：/etc/nginx/conf.d/collector.conf
# 前置：禁用 Ubuntu 默认站点（/etc/nginx/sites-enabled/default），避免抢占 80 端口。
#
# 静态根目录为版本目录的软链接 /opt/yudao/web/current，
# 升级时只需切换软链接。前端使用 hash 路由（VITE_ROUTER_HISTORY=hash），
# 页面路径都在 # 之后，不需要服务端 history 回退，但保留 index.html 兜底。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/yudao/web/current;
    index index.html;

    # application.yaml 中 max-request-size 为 32MB，这里保持一致
    client_max_body_size 32m;

    access_log /var/log/nginx/yudao-access.log;
    error_log  /var/log/nginx/yudao-error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台接口：保留 /admin-api 前缀转发给 yudao-server
    # proxy_pass 不带 URI，Nginx 不会剥离前缀。
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 用户端接口：同样保留 /app-api 前缀
    location /app-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 可选：infra 模块 WebSocket（yudao.websocket.path=/infra/ws）
    # 前端如需使用 WebSocket，再取消注释。
    # location = /infra/ws {
    #     proxy_pass http://127.0.0.1:48080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 300s;
    # }

    # 可选：Druid 监控 / Swagger / Spring Boot Admin 页面。
    # 这些路径不在 /admin-api 下，且 Druid 涉及数据库监控，板端默认不开放。
    # location /druid/ {
    #     proxy_pass http://127.0.0.1:48080;
    #     proxy_set_header Host $host;
    # }
    # location /doc.html {
    #     proxy_pass http://127.0.0.1:48080;
    #     proxy_set_header Host $host;
    # }
    # location /admin/ {
    #     proxy_pass http://127.0.0.1:48080;
    #     proxy_set_header Host $host;
    # }
}
